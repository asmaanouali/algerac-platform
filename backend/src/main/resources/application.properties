# Server
server.port=${SERVER_PORT:8082}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/algerac_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate - defaults to 'validate' (safe for prod); set DDL_AUTO=update for the
# very first deploy (or local dev on a fresh DB) to let Hibernate create the schema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SQL Initialization - set to 'always' only for first-time setup, then switch to 'never'
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.data-locations=classpath:seed-data.sql,classpath:enrich-test-profiles.sql
spring.jpa.defer-datasource-initialization=true

# Jackson - serialize LocalDate/LocalDateTime as ISO strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Session - secure/strict by default; for local HTTP dev, set COOKIE_SECURE=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

# Email Configuration (set MAIL_USERNAME / MAIL_PASSWORD as environment variables, never hardcode here)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Configuration
app.notification.email=${NOTIFICATION_EMAIL:noreply@algerac.dz}
app.dt.email=${DT_EMAIL:dt@algerac.dz}
app.ges.competences.email=${GES_COMPETENCES_EMAIL:competences@algerac.dz}
app.dag.email=${DAG_EMAIL:dag@algerac.dz}
