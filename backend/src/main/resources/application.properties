# Server
server.port=8082

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/algerac_db
spring.datasource.username=postgres
spring.datasource.password=12345
# WARNING: Use 'validate' or 'none' for production (create-drop deletes all data on restart!)
spring.jpa.hibernate.ddl-auto=create-drop
# Disable SQL logs for production (performance issue)
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Initialization - Execute seed data after schema creation
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed-data.sql
spring.jpa.defer-datasource-initialization=true

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false



