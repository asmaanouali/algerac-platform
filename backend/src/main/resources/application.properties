# Server
server.port=${SERVER_PORT:8082}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/algerac_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

# JPA/Hibernate - use 'validate' in production, 'update' only for development
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SQL Initialization - set to 'always' only for first-time setup, then switch to 'never'
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.data-locations=classpath:seed-data.sql,classpath:enrich-test-profiles.sql
spring.jpa.defer-datasource-initialization=true

# Jackson - serialize LocalDate/LocalDateTime as ISO strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:asmaanouali256@gmail.com}
spring.mail.password=${MAIL_PASSWORD:rhysgljeltdtxprv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

